services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: film_tinder
      POSTGRES_USER: film_tinder
      POSTGRES_PASSWORD: film_tinder
    ports:
      - "5432:5432"
    volumes:
      - film_tinder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_tinder -d film_tinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  film_tinder_postgres:
