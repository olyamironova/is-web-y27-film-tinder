services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: film_tinder
      POSTGRES_USER: film_tinder
      POSTGRES_PASSWORD: film_tinder
    ports:
      - "5432:5432"
    volumes:
      - film_tinder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_tinder -d film_tinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://film_tinder:film_tinder@postgres:5432/film_tinder"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e 'GET /hello HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep 'Hello'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  film_tinder_postgres:
