services:
  - type: web
    name: film-tinder
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: film-tinder-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://film-tinder.onrender.com
      - key: SUPERTOKENS_CONNECTION_URI
        sync: false
      - key: SUPERTOKENS_API_KEY
        sync: false
      - key: SUPERTOKENS_APP_NAME
        value: Film Tinder
      - key: SUPERTOKENS_API_DOMAIN
        value: https://film-tinder.onrender.com
      - key: SUPERTOKENS_WEBSITE_DOMAIN
        value: https://film-tinder.onrender.com
      - key: SUPERTOKENS_API_BASE_PATH
        value: /auth

databases:
  - name: film-tinder-db
    plan: free
